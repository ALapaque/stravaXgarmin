<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b33"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.84" r="0.6">
      <stop offset="0" stop-color="#2b6bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2b6bff" stop-opacity="0"/>
    </radialGradient>
    <!-- Strava côté chaud, Garmin côté froid : deux trajectoires qui se croisent -->
    <linearGradient id="warm" x1="0.15" y1="0.85" x2="0.85" y2="0.15">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <linearGradient id="cool" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#00e0c6"/>
      <stop offset="1" stop-color="#2b6bff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9ea"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowA)"/>
    <rect width="1024" height="1024" fill="url(#glowB)"/>

    <!-- Halo diffus sous les deux tracés -->
    <g filter="url(#soft)" opacity="0.7">
      <path d="M268 756 C 420 600, 604 424, 756 268" stroke="url(#warm)" stroke-width="150" stroke-linecap="round" fill="none"/>
      <path d="M268 268 C 420 424, 604 600, 756 756" stroke="url(#cool)" stroke-width="150" stroke-linecap="round" fill="none"/>
    </g>

    <g filter="url(#shadow)">
      <!-- Trajectoire froide (dessous) -->
      <path d="M268 268 C 420 424, 604 600, 756 756" stroke="url(#cool)" stroke-width="128" stroke-linecap="round" fill="none"/>
      <!-- Découpe : la trajectoire chaude passe par-dessus -->
      <path d="M268 756 C 420 600, 604 424, 756 268" stroke="#0d1020" stroke-width="176" stroke-linecap="round" fill="none"/>
      <path d="M268 756 C 420 600, 604 424, 756 268" stroke="url(#warm)" stroke-width="128" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Reflet sur le tracé chaud -->
    <path d="M300 712 C 430 580, 590 430, 712 306" stroke="#ffffff" stroke-opacity="0.28" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Point de synchro au croisement -->
    <circle cx="512" cy="512" r="58" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="40" fill="url(#core)"/>
  </g>
</svg>
