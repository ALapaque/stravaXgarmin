# Version, CHANGELOG.md et release GitHub à chaque push sur main (semantic-release).
# Le commit « chore(release) » est ensuite déployé par Vercel comme les autres :
# c'est lui qui embarque la nouvelle version et ses notes dans l'appli.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Aucune version n'est publiée si les types ou les tests échouent
      - run: npx nuxi typecheck
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
